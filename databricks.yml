# This is a Declarative Automation Bundle definition for AML_detection.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: AML_detection
  uuid: 40969d93-908c-41a6-ac46-8f62606d1325

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-0302f0ae-cf04.cloud.databricks.com
    variables:
      catalog: AML
      schema: ${workspace.current_user.short_name}
    presets:
      artifacts_dynamic_version: true
  prod:
    mode: production
    workspace:
      host: https://dbc-0302f0ae-cf04.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/hsmda2@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/hsmda2@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: AML
      schema: prod
    permissions:
      - user_name: hsmda2@gmail.com
        level: CAN_MANAGE
